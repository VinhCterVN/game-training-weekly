<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"><title>Bus Jam</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#1f2e45;font-family:Arial,sans-serif}body{display:flex;justify-content:center;align-items:center}#game{width:min(100vw,56.25vh);height:min(100vh,177.7778vw);position:relative}canvas{display:block;width:100%;height:100%;touch-action:none}#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;color:white;background:#1f2e45;gap:16px}progress{width:65%;accent-color:#42a5ff}#error{display:none;position:absolute;inset:20%;padding:24px;background:white;color:#1f2e45}
@supports(height:100dvh){#game{width:min(100vw,56.25dvh);height:min(100dvh,177.7778vw)}}
</style></head>
<body><main id="game"><canvas id="unity-canvas" width="1080" height="1920" tabindex="-1" aria-label="Bus Jam puzzle game"></canvas><div id="loading"><h1>BUS JAM</h1><span>Getting your ride ready…</span><progress id="progress" value="0" max="1"></progress></div><div id="error" role="alert"></div></main>
<script src="Build/{{{ LOADER_FILENAME }}}"></script><script>
const canvas=document.getElementById('unity-canvas');
createUnityInstance(canvas,{dataUrl:'Build/{{{ DATA_FILENAME }}}',frameworkUrl:'Build/{{{ FRAMEWORK_FILENAME }}}',codeUrl:'Build/{{{ CODE_FILENAME }}}',streamingAssetsUrl:'StreamingAssets',companyName:'Bus Jam Studio',productName:'Bus Jam',productVersion:'1.0',matchWebGLToCanvasSize:true,devicePixelRatio:Math.min(window.devicePixelRatio,2)},p=>document.getElementById('progress').value=p).then(game=>{window.busJam=game;document.getElementById('loading').style.display='none';canvas.focus()}).catch(error=>{document.getElementById('loading').style.display='none';let e=document.getElementById('error');e.style.display='block';e.textContent='Unable to load Bus Jam. Please reload. '+error});
</script></body></html>
